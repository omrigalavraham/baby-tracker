<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#881337" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Cute Baby Bottle / Footprint / Icon in Center -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(106, 80) scale(0.6)">
    <!-- Baby Bottle Body -->
    <path d="M 150 150 L 350 150 C 370 150 390 170 390 200 L 390 560 C 390 590 370 610 340 610 L 160 610 C 130 610 110 590 110 560 L 110 200 C 110 170 130 150 150 150 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Bottle Ring / Cap -->
    <rect x="130" y="90" width="240" height="60" rx="20" fill="#fecdd3" stroke="#ffffff" stroke-width="8"/>
    <!-- Bottle Nipple -->
    <path d="M 190 90 C 190 30 220 10 250 10 C 280 10 310 30 310 90 Z" fill="#fda4af" opacity="0.9"/>
    <!-- Measurement lines -->
    <rect x="290" y="240" width="60" height="12" rx="6" fill="#fb7185" opacity="0.7"/>
    <rect x="310" y="320" width="40" height="12" rx="6" fill="#fb7185" opacity="0.7"/>
    <rect x="280" y="400" width="70" height="12" rx="6" fill="#fb7185" opacity="0.7"/>
    <rect x="310" y="480" width="40" height="12" rx="6" fill="#fb7185" opacity="0.7"/>
    <!-- Cute Heart in Bottle Center -->
    <path d="M 210 330 C 210 295 160 270 160 315 C 160 350 210 380 210 380 C 210 380 260 350 260 315 C 260 270 210 295 210 330 Z" fill="#f43f5e" opacity="0.8"/>
  </g>
</svg>
