<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Background Gradient (Rose Gold & Champagne Blush) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Golden Shimmer Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Inner Soft Radial Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="luxuryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#881337" flood-opacity="0.35" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fde047" flood-opacity="0.6" />
    </filter>
    <filter id="iconSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4c0519" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Luxury Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" filter="url(#luxuryShadow)" />

  <!-- Inner Ambient Halo Glow -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#haloGlow)" />

  <!-- Elegant Inner Border / Rim -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Central Luxury Emblem: Golden Crescent Moon cradling a sweet newborn & delicate stars -->
  <g filter="url(#iconSoftShadow)">
    
    <!-- Golden Slender Crescent Moon -->
    <path d="M 310 120 C 230 120 170 180 170 260 C 170 340 230 400 310 400 C 335 400 358 393 378 382 C 300 400 230 340 230 260 C 230 180 300 120 378 138 C 358 127 335 120 310 120 Z" 
          fill="url(#goldGrad)" 
          filter="url(#goldGlow)" />

    <!-- Pure White Sleeping Newborn Silhouette Nestled in Moon -->
    <!-- Sweet Baby Head with Beanie & Soft Face Profile -->
    <ellipse cx="275" cy="245" rx="42" ry="40" fill="#ffffff" />
    
    <!-- Delicate Sleeping Eye (Closed arc) -->
    <path d="M 270 248 C 275 254 285 254 290 248" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Rosy Cheek -->
    <ellipse cx="264" cy="254" rx="7" ry="5" fill="#fda4af" opacity="0.8" />
    
    <!-- Cute Beanie Hat on Baby -->
    <path d="M 235 240 C 235 205 270 195 295 210 C 310 220 315 240 315 245 Z" fill="#ffe4e6" />
    <!-- Hat Pom-pom (Small Gold Ball) -->
    <circle cx="230" cy="220" r="10" fill="url(#goldGrad)" filter="url(#goldGlow)" />

    <!-- Swaddled Baby Blanket Body -->
    <path d="M 245 275 C 225 310 260 350 310 340 C 330 335 340 315 330 290 C 320 270 280 265 245 275 Z" fill="#ffffff" opacity="0.95" />

    <!-- Cute Golden Crown on Crescent / Royal Accents -->
    <!-- Three Luxury Stars around the moon -->
    <!-- Star 1 (Top Left) -->
    <path d="M 170 170 L 175 155 L 180 170 L 195 175 L 180 180 L 175 195 L 170 180 L 155 175 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    
    <!-- Star 2 (Center Right) -->
    <path d="M 370 220 L 374 208 L 378 220 L 390 224 L 378 228 L 374 240 L 370 228 L 358 224 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />

    <!-- Star 3 (Bottom Left Small) -->
    <path d="M 190 350 L 193 342 L 196 350 L 204 353 L 196 356 L 193 364 L 190 356 L 182 353 Z" fill="url(#goldGrad)" />

    <!-- Floating Tiny Heart in Pure White & Pink -->
    <path d="M 345 165 C 345 155 330 148 330 160 C 330 170 345 180 345 180 C 345 180 360 170 360 160 C 360 148 345 155 345 165 Z" fill="#ffffff" opacity="0.9" />

  </g>
</svg>
