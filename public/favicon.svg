<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="crescent">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="300" cy="214" r="98" fill="#000"/>
    </mask>
  </defs>
  <!-- Soft blush squircle -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="#F8E4E1"/>
  <!-- Cream halo -->
  <circle cx="256" cy="256" r="164" fill="#FBF7F3"/>
  <!-- Lavender crescent moon -->
  <circle cx="246" cy="262" r="112" fill="#8170A8" mask="url(#crescent)"/>
  <!-- Two quiet stars -->
  <circle cx="332" cy="178" r="9" fill="#B76E6A"/>
  <circle cx="364" cy="218" r="5" fill="#B76E6A" opacity="0.7"/>
</svg>
